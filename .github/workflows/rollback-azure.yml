name: Rollback Azure Deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to roll back to (e.g. abc1234)'
        required: true
        type: string

jobs:
  rollback:
    name: Roll back Azure Container Apps
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: azure-deploy
      cancel-in-progress: false
    env:
      TF_VAR_resource_group_name: "Fitness-AI-App"
      TF_VAR_key_vault_name: "Fitness-AI-App-Secrets"
      TF_VAR_key_vault_resource_group: "Fitness-AI-App"
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_container_image: ${{ secrets.DOCKER_USERNAME }}/fitnessaiapp:sha-${{ github.event.inputs.commit_sha }}
      TF_VAR_ai_container_image: ${{ secrets.DOCKER_USERNAME }}/fitnessaiapp-ai:sha-${{ github.event.inputs.commit_sha }}
      TF_VAR_admin_container_image: ${{ secrets.DOCKER_USERNAME }}/fitnessaiapp-admin-dash:sha-${{ github.event.inputs.commit_sha }}
      TF_VAR_data_tool_container_image: ${{ secrets.DOCKER_USERNAME }}/fitnessaiapp-data-tool:sha-${{ github.event.inputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Azure credentials for Terraform
        run: |
          CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)
          CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)
          TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)
          SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)
          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$CLIENT_SECRET"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$SUBSCRIPTION_ID"
          echo "ARM_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$TENANT_ID" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform init
        working-directory: ./infrastructure/terraform
        run: terraform init -input=false

      - name: Terraform apply (container apps only)
        working-directory: ./infrastructure/terraform
        run: |
          terraform apply -auto-approve -input=false \
            -target=azurerm_container_app.app \
            -target=azurerm_container_app.ai \
            -target=azurerm_container_app.admin \
            -target=azurerm_container_app.data_tool
